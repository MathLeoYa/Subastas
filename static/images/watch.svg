<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="width:100%;height:100%;">
  <defs>
    <radialGradient id="wbg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#080812"/>
    </radialGradient>
    <radialGradient id="wface" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e3e"/>
      <stop offset="100%" stop-color="#0d0d20"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#wbg)"/>
  <!-- Glow effect -->
  <circle cx="200" cy="150" r="100" fill="rgba(245,158,11,0.05)"/>
  <!-- Watch case -->
  <rect x="148" y="60" width="104" height="180" rx="28" fill="#2a2a3e" stroke="#f59e0b" stroke-width="3"/>
  <!-- Crown -->
  <rect x="252" y="120" width="12" height="20" rx="4" fill="#c0a060" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Bezel -->
  <rect x="155" y="67" width="90" height="166" rx="22" fill="#1a1a2e" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <!-- Watch face -->
  <rect x="162" y="74" width="76" height="152" rx="18" fill="url(#wface)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <!-- Hour markers -->
  <g fill="#f59e0b" filter="url(#glow)">
    <rect x="196" y="80" width="8" height="3" rx="1"/>
    <rect x="196" y="217" width="8" height="3" rx="1"/>
    <rect x="162" y="146" width="3" height="8" rx="1"/>
    <rect x="235" y="146" width="3" height="8" rx="1"/>
  </g>
  <!-- Sub-dial -->
  <circle cx="200" cy="175" r="14" fill="none" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <circle cx="200" cy="175" r="2" fill="#f59e0b"/>
  <!-- Hands -->
  <line x1="200" y1="150" x2="200" y2="105" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="200" y1="150" x2="225" y2="148" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="150" x2="195" y2="185" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="200" cy="150" r="4" fill="#f59e0b"/>
  <!-- Brand text -->
  <text x="200" y="130" text-anchor="middle" fill="rgba(245,158,11,0.8)" font-size="7" font-family="Georgia" letter-spacing="2">SUBMARINER</text>
  <!-- Strap -->
  <rect x="165" y="240" width="70" height="30" rx="6" fill="#1a0a00"/>
  <rect x="165" y="30" width="70" height="30" rx="6" fill="#1a0a00"/>
  <!-- Buckle -->
  <rect x="180" y="260" width="40" height="8" rx="3" fill="#c0a060" stroke="#f59e0b" stroke-width="1"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" fill="rgba(245,158,11,0.5)" font-size="9" font-family="Inter,sans-serif">ROLEX SUBMARINER 1969</text>
</svg>
