<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="width:100%;height:100%;">
  <defs>
    <radialGradient id="gbg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a0a"/>
      <stop offset="100%" stop-color="#080810"/>
    </radialGradient>
    <linearGradient id="gbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a060"/>
      <stop offset="50%" stop-color="#8b5e20"/>
      <stop offset="100%" stop-color="#5a3510"/>
    </linearGradient>
    <linearGradient id="gneck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4020"/>
      <stop offset="100%" stop-color="#4a2a10"/>
    </linearGradient>
    <filter id="gglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#gbg)"/>
  <!-- Spotlight effect -->
  <radialGradient id="spot" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgba(245,158,11,0.08)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <rect width="400" height="300" fill="url(#spot)"/>
  <!-- Guitar body -->
  <ellipse cx="200" cy="200" rx="72" ry="80" fill="url(#gbody)" stroke="#c4a44a" stroke-width="2"/>
  <!-- Upper bout -->
  <ellipse cx="200" cy="140" rx="52" ry="50" fill="url(#gbody)" stroke="#c4a44a" stroke-width="2"/>
  <!-- Waist -->
  <rect x="162" y="163" width="76" height="30" fill="#7a4820"/>
  <!-- Sound hole -->
  <circle cx="200" cy="190" r="22" fill="#1a0a02" stroke="#c4a44a" stroke-width="2"/>
  <circle cx="200" cy="190" r="18" fill="#0d0501" stroke="rgba(196,164,74,0.4)" stroke-width="1"/>
  <!-- F-holes suggestion -->
  <ellipse cx="172" cy="185" rx="4" ry="12" fill="#0a0502" stroke="rgba(196,164,74,0.3)" stroke-width="1"/>
  <ellipse cx="228" cy="185" rx="4" ry="12" fill="#0a0502" stroke="rgba(196,164,74,0.3)" stroke-width="1"/>
  <!-- Neck -->
  <rect x="188" y="50" width="24" height="100" rx="6" fill="url(#gneck)" stroke="#8b6020" stroke-width="1.5"/>
  <!-- Frets -->
  <g stroke="#c4a44a" stroke-width="1.5" opacity="0.7">
    <line x1="188" y1="75" x2="212" y2="75"/>
    <line x1="188" y1="90" x2="212" y2="90"/>
    <line x1="188" y1="104" x2="212" y2="104"/>
    <line x1="188" y1="117" x2="212" y2="117"/>
    <line x1="188" y1="129" x2="212" y2="129"/>
    <line x1="188" y1="140" x2="212" y2="140"/>
  </g>
  <!-- Fret markers -->
  <circle cx="200" cy="82" r="2.5" fill="rgba(245,158,11,0.6)"/>
  <circle cx="200" cy="110" r="2.5" fill="rgba(245,158,11,0.6)"/>
  <!-- Strings -->
  <g stroke="#e8e0d0" opacity="0.7">
    <line x1="192" y1="50" x2="192" y2="270" stroke-width="0.8"/>
    <line x1="196" y1="50" x2="196" y2="270" stroke-width="0.9"/>
    <line x1="200" y1="50" x2="200" y2="270" stroke-width="1.0"/>
    <line x1="204" y1="50" x2="204" y2="270" stroke-width="1.1"/>
    <line x1="208" y1="50" x2="208" y2="270" stroke-width="1.2"/>
    <line x1="212" y1="50" x2="212" y2="270" stroke-width="1.3"/>
  </g>
  <!-- Headstock -->
  <rect x="183" y="30" width="34" height="28" rx="8" fill="#5a3010" stroke="#8b6020" stroke-width="1.5"/>
  <!-- Tuning pegs -->
  <g fill="#c4a44a">
    <circle cx="188" cy="36" r="4"/>
    <circle cx="200" cy="34" r="4"/>
    <circle cx="212" cy="36" r="4"/>
    <circle cx="188" cy="52" r="4"/>
    <circle cx="200" cy="54" r="4"/>
    <circle cx="212" cy="52" r="4"/>
  </g>
  <!-- Bridge -->
  <rect x="178" y="218" width="44" height="8" rx="3" fill="#8b6020" stroke="#c4a44a" stroke-width="1"/>
  <!-- Strap pin -->
  <circle cx="200" cy="278" r="5" fill="#8b6020" stroke="#c4a44a" stroke-width="1.5"/>
  <!-- Label -->
  <text x="200" y="295" text-anchor="middle" fill="rgba(245,158,11,0.5)" font-size="9" font-family="Inter,sans-serif">GIBSON LES PAUL CUSTOM 1959</text>
</svg>
