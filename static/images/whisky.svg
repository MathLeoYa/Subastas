<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="width:100%;height:100%;">
  <defs>
    <radialGradient id="wkybg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0f08"/>
      <stop offset="100%" stop-color="#050305"/>
    </radialGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8e8f8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#88b8d8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#4888b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a5080" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="crystalShine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8781e"/>
      <stop offset="100%" stop-color="#7a3a08"/>
    </linearGradient>
    <filter id="wglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crystalshine">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#wkybg)"/>
  <!-- Ambient glow -->
  <radialGradient id="ambglow" cx="50%" cy="40%" r="40%">
    <stop offset="0%" stop-color="rgba(200,120,30,0.1)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <rect width="400" height="300" fill="url(#ambglow)"/>
  <!-- Wooden box (cedar) -->
  <rect x="60" y="200" width="280" height="70" rx="6" fill="#3a1a08" stroke="#6a3a18" stroke-width="2"/>
  <rect x="62" y="202" width="276" height="8" rx="3" fill="#5a2a10" opacity="0.8"/>
  <!-- Wood grain lines -->
  <g stroke="#2a1005" stroke-width="0.5" opacity="0.5">
    <line x1="70" y1="215" x2="330" y2="215"/>
    <line x1="70" y1="222" x2="330" y2="222"/>
    <line x1="70" y1="229" x2="330" y2="229"/>
    <line x1="70" y1="236" x2="330" y2="236"/>
    <line x1="70" y1="243" x2="330" y2="243"/>
    <line x1="70" y1="250" x2="330" y2="250"/>
    <line x1="70" y1="257" x2="330" y2="257"/>
  </g>
  <!-- Box metal clasp -->
  <rect x="188" y="198" width="24" height="10" rx="3" fill="#c4a44a" stroke="#f59e0b" stroke-width="1"/>
  <!-- Lalique Crystal Decanter - main body -->
  <!-- Stopper -->
  <ellipse cx="200" cy="60" rx="22" ry="12" fill="url(#crystal)" stroke="rgba(200,230,250,0.5)" stroke-width="1.5" filter="url(#crystalshine)"/>
  <ellipse cx="200" cy="60" rx="15" ry="8" fill="url(#crystalShine)"/>
  <!-- Stopper facets -->
  <path d="M183 60 L200 48 L217 60 L200 72 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(200,230,255,0.3)" stroke-width="0.5"/>
  <!-- Neck -->
  <rect x="191" y="68" width="18" height="28" rx="4" fill="url(#crystal)" stroke="rgba(200,230,250,0.4)" stroke-width="1"/>
  <rect x="193" y="70" width="7" height="24" rx="2" fill="url(#crystalShine)" opacity="0.5"/>
  <!-- Main decanter body -->
  <path d="M168 96 Q162 110 160 135 Q158 158 160 175 Q162 196 172 200 L228 200 Q238 196 240 175 Q242 158 240 135 Q238 110 232 96 Z" fill="url(#crystal)" stroke="rgba(200,230,250,0.5)" stroke-width="1.5" filter="url(#crystalshine)"/>
  <!-- Crystal facets decoration -->
  <path d="M168 96 L200 88 L232 96 L228 200 L172 200 Z" fill="url(#crystalShine)" opacity="0.3"/>
  <!-- Whisky liquid inside -->
  <path d="M171 150 Q168 165 170 178 Q172 194 175 198 L225 198 Q228 194 230 178 Q232 165 229 150 Z" fill="url(#amber)" opacity="0.85"/>
  <!-- Liquid surface ripple -->
  <ellipse cx="200" cy="150" rx="29" ry="6" fill="#c8781e" opacity="0.6"/>
  <!-- Crystal carved pattern on body -->
  <g stroke="rgba(200,230,255,0.25)" stroke-width="0.8" fill="none">
    <path d="M172 110 Q200 105 228 110"/>
    <path d="M170 125 Q200 120 230 125"/>
    <path d="M169 140 Q200 135 231 140"/>
    <path d="M175 108 L180 198"/>
    <path d="M185 105 L188 198"/>
    <path d="M200 103 L200 148"/>
    <path d="M215 105 L212 198"/>
    <path d="M225 108 L220 198"/>
  </g>
  <!-- Base of decanter -->
  <ellipse cx="200" cy="200" rx="32" ry="8" fill="url(#crystal)" stroke="rgba(200,230,250,0.4)" stroke-width="1.5"/>
  <ellipse cx="200" cy="202" rx="28" ry="5" fill="rgba(50,100,150,0.3)"/>
  <!-- Reflection highlight -->
  <path d="M173 110 Q176 130 174 155" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Label on decanter -->
  <rect x="180" y="158" width="40" height="24" rx="2" fill="rgba(245,230,190,0.1)" stroke="rgba(245,230,190,0.3)" stroke-width="1"/>
  <text x="200" y="168" text-anchor="middle" fill="rgba(245,230,190,0.7)" font-size="5.5" font-family="Georgia" letter-spacing="1">MACALLAN</text>
  <text x="200" y="176" text-anchor="middle" fill="rgba(245,230,190,0.8)" font-size="7" font-family="Georgia" font-weight="bold">50 YEARS</text>
  <!-- Label bottom -->
  <text x="200" y="292" text-anchor="middle" fill="rgba(200,120,30,0.5)" font-size="9" font-family="Inter,sans-serif">MACALLAN 50 YEARS — LALIQUE CRYSTAL</text>
</svg>
