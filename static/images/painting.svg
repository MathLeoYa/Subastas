<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="width:100%;height:100%;">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="60%" stop-color="#e8a44a"/>
      <stop offset="100%" stop-color="#c0622a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <filter id="pglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Canvas frame -->
  <rect width="400" height="300" fill="#1a0e08"/>
  <rect x="20" y="20" width="360" height="260" fill="#1a0e08" stroke="#8b6914" stroke-width="6"/>
  <rect x="26" y="26" width="348" height="248" fill="#0d0808" stroke="#c4a44a" stroke-width="2"/>
  <!-- Painting inside frame -->
  <rect x="30" y="30" width="340" height="240" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="280" cy="90" r="35" fill="#fbbf24" opacity="0.9" filter="url(#pglow)"/>
  <circle cx="280" cy="90" r="25" fill="#fde68a"/>
  <!-- Sun rays -->
  <g stroke="#fde68a" stroke-width="2" opacity="0.6">
    <line x1="280" y1="45" x2="280" y2="38"/>
    <line x1="280" y1="135" x2="280" y2="142"/>
    <line x1="235" y1="90" x2="228" y2="90"/>
    <line x1="325" y1="90" x2="332" y2="90"/>
    <line x1="249" y1="59" x2="244" y2="54"/>
    <line x1="311" y1="121" x2="316" y2="126"/>
    <line x1="311" y1="59" x2="316" y2="54"/>
    <line x1="249" y1="121" x2="244" y2="126"/>
  </g>
  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="45" ry="18" fill="rgba(255,220,150,0.4)"/>
  <ellipse cx="110" cy="55" rx="35" ry="15" fill="rgba(255,220,150,0.5)"/>
  <ellipse cx="150" cy="70" rx="30" ry="12" fill="rgba(255,200,120,0.3)"/>
  <!-- Mediterranean sea -->
  <rect x="30" y="170" width="340" height="100" fill="url(#sea)"/>
  <!-- Water reflections -->
  <path d="M30 180 Q100 172 170 180 Q240 188 310 180 Q355 174 370 180 L370 190 Q310 196 240 188 Q170 180 100 188 Q55 192 30 190 Z" fill="rgba(251,191,36,0.15)"/>
  <path d="M30 200 Q130 193 200 200 Q270 207 370 200 L370 206 Q270 213 200 206 Q130 199 30 206 Z" fill="rgba(251,191,36,0.1)"/>
  <!-- Coastline / cliffs -->
  <path d="M30 170 Q60 155 90 160 Q110 152 130 165 Q150 150 180 168 Q200 145 220 162 Q240 155 260 168 Q280 158 310 165 L370 170 L370 210 L30 210 Z" fill="#2d5a1e" opacity="0.8"/>
  <path d="M30 165 Q70 148 100 155 Q130 142 160 160 Q190 140 220 158 L220 170 L30 170 Z" fill="#3a7a28" opacity="0.7"/>
  <!-- Small sailboat -->
  <path d="M160 165 L155 135 L185 165 Z" fill="rgba(255,255,255,0.8)"/>
  <rect x="158" y="162" width="22" height="4" rx="2" fill="#8b4513"/>
  <!-- Frame corner ornaments -->
  <rect x="20" y="20" width="12" height="12" fill="#c4a44a"/>
  <rect x="368" y="20" width="12" height="12" fill="#c4a44a"/>
  <rect x="20" y="268" width="12" height="12" fill="#c4a44a"/>
  <rect x="368" y="268" width="12" height="12" fill="#c4a44a"/>
  <!-- Artist signature -->
  <text x="310" y="255" fill="rgba(255,220,150,0.6)" font-size="8" font-family="Georgia" font-style="italic">R. Vidal '52</text>
</svg>
