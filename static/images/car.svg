<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="width:100%;height:100%;">
  <defs>
    <linearGradient id="carbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="carbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4a8a"/>
      <stop offset="40%" stop-color="#1a3f7a"/>
      <stop offset="100%" stop-color="#0d2050"/>
    </linearGradient>
    <linearGradient id="carhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#1a4a9a"/>
    </linearGradient>
    <filter id="carlight">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="floor" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="rgba(26,64,138,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#carbg)"/>
  <!-- Floor reflection -->
  <ellipse cx="200" cy="270" rx="160" ry="20" fill="rgba(26,64,138,0.2)"/>
  <!-- Car shadow -->
  <ellipse cx="200" cy="248" rx="135" ry="10" fill="rgba(0,0,0,0.5)"/>
  <!-- Rear wheel -->
  <circle cx="100" cy="235" r="32" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
  <circle cx="100" cy="235" r="22" fill="#252525"/>
  <circle cx="100" cy="235" r="14" fill="#111" stroke="#c4a44a" stroke-width="2"/>
  <!-- Spoke pattern rear -->
  <g stroke="#c4a44a" stroke-width="1.5" transform="translate(100,235)">
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <line x1="-20" y1="0" x2="20" y2="0"/>
    <line x1="-14" y1="-14" x2="14" y2="14"/>
    <line x1="14" y1="-14" x2="-14" y2="14"/>
  </g>
  <!-- Front wheel -->
  <circle cx="300" cy="235" r="32" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
  <circle cx="300" cy="235" r="22" fill="#252525"/>
  <circle cx="300" cy="235" r="14" fill="#111" stroke="#c4a44a" stroke-width="2"/>
  <!-- Spoke pattern front -->
  <g stroke="#c4a44a" stroke-width="1.5" transform="translate(300,235)">
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <line x1="-20" y1="0" x2="20" y2="0"/>
    <line x1="-14" y1="-14" x2="14" y2="14"/>
    <line x1="14" y1="-14" x2="-14" y2="14"/>
  </g>
  <!-- Car body -->
  <path d="M55 235 L55 195 Q58 188 75 180 L120 155 Q148 130 175 125 L230 122 Q265 122 285 135 L330 160 Q355 175 360 185 L362 195 L362 235 Z" fill="url(#carbody)" stroke="rgba(74,144,217,0.4)" stroke-width="1.5"/>
  <!-- Car roof/greenhouse -->
  <path d="M148 125 Q170 100 200 95 Q230 90 255 100 L285 125 Z" fill="url(#carhood)" stroke="rgba(74,144,217,0.6)" stroke-width="1"/>
  <!-- Windshield -->
  <path d="M155 124 Q175 104 205 99 Q232 94 255 106 L278 124 Z" fill="rgba(100,160,240,0.25)" stroke="rgba(100,160,240,0.4)" stroke-width="1"/>
  <!-- Rear window -->
  <path d="M148 125 L165 124 Q160 115 155 110 L148 125 Z" fill="rgba(80,120,200,0.2)" stroke="rgba(80,120,200,0.3)" stroke-width="0.8"/>
  <!-- Side window -->
  <path d="M166 124 L200 100 L254 107 L280 124 L240 126 L200 128 Z" fill="rgba(80,130,220,0.15)" stroke="rgba(80,130,220,0.3)" stroke-width="0.8"/>
  <!-- Door line -->
  <path d="M160 160 Q210 155 260 158" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
  <!-- Headlights (front) -->
  <ellipse cx="348" cy="192" rx="14" ry="8" fill="#fde68a" opacity="0.9" filter="url(#carlight)"/>
  <ellipse cx="348" cy="192" rx="8" ry="5" fill="#fff"/>
  <!-- Headlight beam -->
  <path d="M362 188 L400 170 L400 200 L362 196 Z" fill="rgba(253,230,138,0.05)"/>
  <!-- Tail lights -->
  <ellipse cx="62" cy="195" rx="10" ry="6" fill="#ef4444" opacity="0.8" filter="url(#carlight)"/>
  <!-- Front bumper -->
  <path d="M340 220 Q360 215 365 230 L362 235 Q355 232 340 228 Z" fill="#1a2a4a" stroke="rgba(74,144,217,0.3)" stroke-width="1"/>
  <!-- Rear bumper -->
  <path d="M55 225 Q50 220 50 230 L55 235 Q60 232 70 228 Z" fill="#1a2a4a" stroke="rgba(74,144,217,0.3)" stroke-width="1"/>
  <!-- Door handle -->
  <rect x="205" y="176" width="18" height="4" rx="2" fill="rgba(196,164,74,0.6)"/>
  <!-- Porsche crest suggestion -->
  <circle cx="200" cy="155" r="6" fill="rgba(245,158,11,0.3)" stroke="#c4a44a" stroke-width="1"/>
  <!-- Label -->
  <text x="200" y="292" text-anchor="middle" fill="rgba(74,144,217,0.6)" font-size="9" font-family="Inter,sans-serif">PORSCHE 911 CARRERA S — 2019</text>
</svg>
