<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="width:100%;height:100%;">
  <defs>
    <linearGradient id="bookbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0810"/>
      <stop offset="100%" stop-color="#080510"/>
    </linearGradient>
    <filter id="bookshadow">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bookbg)"/>
  <!-- Glow backdrop -->
  <radialGradient id="bookglow" cx="50%" cy="60%" r="40%">
    <stop offset="0%" stop-color="rgba(139,0,0,0.15)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <rect width="400" height="300" fill="url(#bookglow)"/>

  <!-- Book 7 (back-right) -->
  <rect x="265" y="100" width="42" height="140" rx="3" fill="#1a3a1a" stroke="#2a5a2a" stroke-width="1.5" filter="url(#bookshadow)"/>
  <rect x="267" y="102" width="4" height="136" rx="1" fill="#2a5a2a" opacity="0.8"/>
  <text x="286" y="162" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="Georgia" transform="rotate(90,286,162)">DEATHLY HALLOWS</text>

  <!-- Book 6 -->
  <rect x="238" y="105" width="38" height="135" rx="3" fill="#1a1a3a" stroke="#3a3a6a" stroke-width="1.5" filter="url(#bookshadow)"/>
  <rect x="240" y="107" width="4" height="131" rx="1" fill="#3a3a6a" opacity="0.8"/>
  <text x="257" y="162" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="Georgia" transform="rotate(90,257,162)">HALF BLOOD PRINCE</text>

  <!-- Book 5 -->
  <rect x="208" y="98" width="40" height="142" rx="3" fill="#2a1a0a" stroke="#5a3a1a" stroke-width="1.5" filter="url(#bookshadow)"/>
  <rect x="210" y="100" width="4" height="138" rx="1" fill="#5a3a1a" opacity="0.8"/>
  <text x="228" y="162" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="Georgia" transform="rotate(90,228,162)">ORDER OF THE PHOENIX</text>

  <!-- Book 4 -->
  <rect x="178" y="102" width="40" height="138" rx="3" fill="#3a0a0a" stroke="#6a1a1a" stroke-width="1.5" filter="url(#bookshadow)"/>
  <rect x="180" y="104" width="4" height="134" rx="1" fill="#6a1a1a" opacity="0.8"/>
  <text x="198" y="165" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="Georgia" transform="rotate(90,198,165)">GOBLET OF FIRE</text>

  <!-- Book 3 -->
  <rect x="148" y="108" width="38" height="132" rx="3" fill="#1a2a0a" stroke="#3a5a1a" stroke-width="1.5" filter="url(#bookshadow)"/>
  <rect x="150" y="110" width="4" height="128" rx="1" fill="#3a5a1a" opacity="0.8"/>
  <text x="167" y="168" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="Georgia" transform="rotate(90,167,168)">PRISONER OF AZKABAN</text>

  <!-- Book 2 -->
  <rect x="118" y="112" width="38" height="128" rx="3" fill="#0a1a3a" stroke="#1a3a6a" stroke-width="1.5" filter="url(#bookshadow)"/>
  <rect x="120" y="114" width="4" height="124" rx="1" fill="#1a3a6a" opacity="0.8"/>
  <text x="137" y="170" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="Georgia" transform="rotate(90,137,170)">CHAMBER OF SECRETS</text>

  <!-- Book 1 (front-left, most prominent) -->
  <rect x="83" y="108" width="44" height="132" rx="3" fill="#5a1a00" stroke="#f59e0b" stroke-width="2" filter="url(#bookshadow)"/>
  <rect x="85" y="110" width="5" height="128" rx="1" fill="#8b3a0a" opacity="0.8"/>
  <!-- Cover decoration -->
  <rect x="92" y="118" width="30" height="40" rx="2" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
  <!-- Lightning bolt on cover -->
  <path d="M107 122 L103 134 L108 134 L103 148 L114 132 L109 132 Z" fill="#f59e0b" opacity="0.8"/>
  <!-- Title on Book 1 -->
  <text x="107" y="167" text-anchor="middle" fill="rgba(245,158,11,0.9)" font-size="6.5" font-family="Georgia" font-weight="bold" transform="rotate(90,107,167)">PHILOSOPHER'S STONE</text>

  <!-- Book shelf bottom line -->
  <rect x="60" y="240" width="280" height="8" rx="4" fill="#2a1a0a" stroke="#5a3a1a" stroke-width="1"/>

  <!-- Golden stars / sparkles -->
  <g fill="#f59e0b" opacity="0.5">
    <circle cx="50" cy="80" r="2"/>
    <circle cx="340" cy="70" r="1.5"/>
    <circle cx="360" cy="130" r="2"/>
    <circle cx="70" cy="200" r="1.5"/>
    <circle cx="330" cy="220" r="2"/>
  </g>

  <!-- Leather case suggestion -->
  <rect x="62" y="242" width="276" height="16" rx="4" fill="#3a1a0a" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="200" y="254" text-anchor="middle" fill="rgba(245,158,11,0.5)" font-size="8" font-family="Inter,sans-serif" letter-spacing="2">HARRY POTTER — PRIMERAS EDICIONES</text>
</svg>
